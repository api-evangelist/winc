name: Winc
description: >-
  Winc is a direct-to-consumer online wine club and retailer (winc.com) offering curated,
  personalized wine subscriptions and single-bottle purchases matched to a member's palate
  profile. The winc.com storefront runs on Shopify and exposes a modern agentic-commerce
  surface: a hosted UCP (Universal Commerce Protocol) MCP endpoint, Shopify Customer Account
  API authentication (OpenID Connect), and published /llms.txt and /agents.md agent
  instructions that let AI shopping assistants discover the catalog, build carts, and drive
  buyer-approved checkout. Originally surfaced as a VC portfolio company and enriched from its
  public agent-facing surface by the API Evangelist enrichment pipeline.
